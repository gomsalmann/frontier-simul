<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#0b3c5d" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a1622" media="(prefers-color-scheme: dark)" />
<title>프론티어신경과 자금 시뮬레이터</title>
<style>
  :root{
    --bg1:#eef3f9; --bg2:#dde8f3; --card:#ffffff; --ink:#0e2033; --sub:#5b7089;
    --line:#dbe4ee; --field:#f7fafd; --pri:#0d5c8c; --pri2:#0b3c5d;
    --err:#c62828; --errbg:#fdecea; --shadow:0 18px 50px rgba(11,60,93,.16);
    --ring:rgba(13,92,140,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#0a1622; --bg2:#0e2233; --card:#111d29; --ink:#eaf1f8; --sub:#93a8bd;
      --line:#22323f; --field:#0d1926; --pri:#4aa3dd; --pri2:#8cc8ee;
      --err:#ff8a80; --errbg:#2a1412; --shadow:0 18px 50px rgba(0,0,0,.55);
      --ring:rgba(74,163,221,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg1) 55%, var(--bg1) 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:390px; background:var(--card);
    border:1px solid var(--line); border-radius:22px;
    padding:30px 24px 26px; box-shadow:var(--shadow);
    text-align:center;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .badge{
    width:54px;height:54px;margin:0 auto 16px;border-radius:16px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,#0b3c5d,#1273a8);
    box-shadow:0 8px 18px rgba(11,60,93,.28);
  }
  .badge svg{width:26px;height:26px;display:block}
  h1{font-size:19px;line-height:1.35;margin:0 0 6px;letter-spacing:-.4px}
  .sub{font-size:13px;color:var(--sub);margin:0 0 22px;line-height:1.5}
  label.lbl{display:block;text-align:left;font-size:12px;font-weight:800;color:var(--sub);
    letter-spacing:.2px;margin:0 0 7px 2px}
  .pinwrap{position:relative}
  input[type=password]{
    width:100%; font:inherit; font-size:24px; font-weight:800; letter-spacing:.42em;
    text-align:center; color:var(--ink); background:var(--field);
    border:1.5px solid var(--line); border-radius:14px;
    padding:15px 14px 15px 20px; -webkit-appearance:none; appearance:none;
    font-variant-numeric:tabular-nums;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=password]::placeholder{letter-spacing:.3em;color:var(--sub);opacity:.5;font-weight:600}
  input[type=password]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--ring);background:var(--card)}
  button{
    width:100%; margin-top:12px; font:inherit; font-size:16px; font-weight:800;
    color:#fff; background:linear-gradient(135deg,var(--pri2),var(--pri));
    border:0; border-radius:14px; padding:15px 16px; cursor:pointer;
    transition:transform .08s, opacity .15s, filter .15s;
    -webkit-tap-highlight-color:transparent;
  }
  @media (prefers-color-scheme: dark){button{background:linear-gradient(135deg,#1b5a86,#2f86c2)}}
  button:active{transform:scale(.985)}
  button[disabled]{opacity:.6;cursor:default}
  .msg{min-height:20px; margin-top:12px; font-size:12.5px; line-height:1.45; color:var(--sub)}
  .msg.err{color:var(--err);background:var(--errbg);border-radius:10px;padding:9px 11px;font-weight:700}
  .msg.ok{color:#057a55;font-weight:700}
  @media (prefers-color-scheme: dark){.msg.ok{color:#5bd6a3}}
  .shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .foot{margin-top:20px;font-size:11px;color:var(--sub);line-height:1.5;opacity:.85}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.card{animation:none}.shake{animation:none}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="10.5" width="15" height="10" rx="2.6"></rect>
      <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"></path>
      <circle cx="12" cy="15.4" r="1.25" fill="#fff" stroke="none"></circle>
    </svg>
  </div>
  <h1>프론티어신경과 자금 시뮬레이터</h1>
  <p class="sub">암호화된 문서입니다.<br>6자리 PIN을 입력하면 열립니다.</p>

  <label class="lbl" for="pin">PIN</label>
  <div class="pinwrap">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="••••••" aria-label="6자리 PIN" />
  </div>
  <button id="go" type="button">열기</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <p class="foot">AES-256-GCM · PBKDF2-SHA256<br>화면의 숫자는 열린 뒤 이 브라우저 안에서만 계산됩니다.</p>
</main>

  var pinEl = document.getElementById('pin');
  var goEl  = document.getElementById('go');
  var msgEl = document.getElementById('msg');
  var cardEl= document.getElementById('card');
  var busy  = false;

  var B64 = function(s){
    var bin = atob(s), len = bin.length, out = new Uint8Array(len);
    for (var i=0;i<len;i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  var setMsg = function(text, cls){
    msgEl.className = 'msg' + (cls ? ' ' + cls : '');
    msgEl.textContent = text || '';
  };
  var fail = function(text){
    cardEl.classList.remove('shake');
    void cardEl.offsetWidth;
    cardEl.classList.add('shake');
    setMsg(text, 'err');
    pinEl.select();
    pinEl.focus();
  };

  async function unlock(){
    if (busy) return;
    var pin = (pinEl.value || '').replace(/\s/g,'');
    if (!pin){ fail('PIN을 입력해 주세요.'); return; }
    if (!window.crypto || !window.crypto.subtle){ fail('이 브라우저에서는 암호 해제를 지원하지 않습니다. 최신 Safari·Chrome으로 열어 주세요.'); return; }

    busy = true;
    goEl.disabled = true;
    pinEl.disabled  = true;
    goEl.innerHTML = '<span class="spin"></span>여는 중…';
    setMsg('', '');

    try{
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: B64(D.salt), iterations: D.iterations, hash:'SHA-256' },
        baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']
      );
      var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: B64(D.iv) }, key, B64(D.ct));
      var html = new TextDecoder('utf-8').decode(plain);

      setMsg('확인되었습니다. 여는 중…', 'ok');
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      busy = false;
      goEl.disabled = false;
      pinEl.disabled  = false;
      goEl.textContent = '열기';
      pinEl.value = '';
      fail('PIN이 맞지 않습니다. 다시 입력해 주세요.');
    }
  }

  goEl.addEventListener('click', unlock);
  pinEl.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); unlock(); } });
  pinEl.addEventListener('input', function(){
    pinEl.value = pinEl.value.replace(/[^0-9]/g,'').slice(0,6);
    if (msgEl.classList.contains('err')) setMsg('', '');
    if (pinEl.value.length === 6) unlock();
  });
  pinEl.focus();
})();
</script>
